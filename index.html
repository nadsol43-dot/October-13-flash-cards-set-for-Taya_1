<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Collocations Flashcards</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
  }

  h1 {
    font-size: 1.6rem;
    margin-bottom: 10px;
    text-align: center;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,.4);
  }

  .counter {
    font-size: 1rem;
    margin-bottom: 18px;
    opacity: .75;
    font-weight: 500;
  }

  /* ---- card scene ---- */
  .card-scene {
    width: 460px;
    max-width: 92vw;
    height: 300px;
    perspective: 1200px;
    margin-bottom: 30px;
    cursor: pointer;
  }

  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform .6s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }

  .card.is-flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 28px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,.45);
  }

  .card-front {
    background: linear-gradient(145deg, #667eea, #764ba2);
  }

  .card-back {
    background: linear-gradient(145deg, #f093fb, #f5576c);
    transform: rotateY(180deg);
  }

  .card-face .label {
    font-size: .75rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: .7;
    margin-bottom: 14px;
  }

  .card-face .text {
    font-size: 1.45rem;
    font-weight: 600;
    line-height: 1.5;
  }

  .hint {
    font-size: .8rem;
    opacity: .5;
    margin-top: 16px;
  }

  /* ---- buttons ---- */
  .controls {
    display: flex;
    gap: 20px;
  }

  .btn {
    padding: 14px 38px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: all .25s ease;
    letter-spacing: .5px;
    text-transform: uppercase;
  }

  .btn-back {
    background: rgba(255,255,255,.12);
    color: #fff;
    border: 2px solid rgba(255,255,255,.3);
  }
  .btn-back:hover { background: rgba(255,255,255,.25); }

  .btn-next {
    background: linear-gradient(135deg, #43e97b, #38f9d7);
    color: #1a1a2e;
  }
  .btn-next:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(67,233,123,.4); }

  .btn:active { transform: scale(.96); }

  /* progress bar */
  .progress-wrap {
    width: 460px;
    max-width: 92vw;
    height: 5px;
    background: rgba(255,255,255,.15);
    border-radius: 5px;
    margin-bottom: 24px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #43e97b, #38f9d7);
    border-radius: 5px;
    transition: width .4s ease;
  }

  /* keyboard hint */
  .kb-hint {
    position: fixed;
    bottom: 16px;
    font-size: .75rem;
    opacity: .35;
  }
</style>
</head>
<body>

<h1>📚 Collocations Flashcards</h1>
<div class="counter" id="counter">1 / 96</div>
<div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>

<div class="card-scene" id="scene" onclick="flipCard()">
  <div class="card" id="card">
    <div class="card-face card-front">
      <div class="label">🇷🇺 Русский</div>
      <div class="text" id="frontText"></div>
      <div class="hint">нажмите, чтобы перевернуть</div>
    </div>
    <div class="card-face card-back">
      <div class="label">🇬🇧 English</div>
      <div class="text" id="backText"></div>
      <div class="hint">click to flip back</div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-back" onclick="goBack()">← Back</button>
  <button class="btn btn-next" onclick="goNext()">Next →</button>
</div>

<div class="kb-hint">Keyboard: ← Back &#xa0;|&#xa0; → Next &#xa0;|&#xa0; Space Flip</div>

<script>
const cards = [
  ["трудоёмкая задача","time-consuming task"],
  ["трудоёмкий процесс","time-consuming process"],
  ["трудоёмкий проект","time-consuming project"],
  ["объединяющий фактор","unifying factor"],
  ["объединяющая тема","unifying theme"],
  ["объединяющая сила","unifying force"],
  ["увлекательная история","engaging story"],
  ["увлекательный разговор","engaging conversation"],
  ["увлекательное занятие","engaging activity"],
  ["питательная еда","nutritious food"],
  ["питательный приём пищи","nutritious meal"],
  ["питательный перекус","nutritious snack"],
  ["художественная выставка","art exhibition"],
  ["фотовыставка","photo exhibition"],
  ["посетить выставку","visit an exhibition"],
  ["проводить выставку","hold an exhibition"],
  ["она больна гриппом","she is ill with the flu"],
  ["она больна пневмонией","she is ill with pneumonia"],
  ["заболеть","fall ill"],
  ["посещать школу","attend school"],
  ["посещать университет","attend university"],
  ["посещать занятия","attend classes"],
  ["присутствовать на собрании","attend a meeting"],
  ["присутствовать на конференции","attend a conference"],
  ["техника живописи","painting technique"],
  ["техника дыхания","breathing technique"],
  ["техника обучения","learning technique"],
  ["овладеть техникой","master a technique"],
  ["страна происхождения","country of origin"],
  ["происхождение слова","word origin"],
  ["дизайн интерьера","interior design"],
  ["графический дизайн","graphic design"],
  ["дизайн продукта","product design"],
  ["создать дизайн","create a design"],
  ["утвердить дизайн","approve a design"],
  ["школа расположена в центре","school is situated in the center"],
  ["школа расположена рядом с парком","school is situated near the park"],
  ["удобно расположенный","conveniently situated"],
  ["три дня назад, если быть точным","three days ago, to be exact"],
  ["12 июня, если быть точным","on June 12th, to be exact"],
  ["активно вовлечён в политику","actively involved in politics"],
  ["глубоко вовлечён в исследования","deeply involved in research"],
  ["вовлечён в благотворительную деятельность","involved in charity work"],
  ["достичь цели","reach a goal"],
  ["добраться до места назначения","reach a destination"],
  ["достичь соглашения","reach an agreement"],
  ["легко добраться до станции","easily reach the station"],
  ["движение транспорта идёт плавно","traffic flows smoothly"],
  ["информация свободно распространяется","information flows freely"],
  ["река протекает через эту местность","a river flows through the area"],
  ["спорить с кем-то","argue with someone"],
  ["спорить о деньгах","argue about money"],
  ["отстаивать идею","argue for an idea"],
  ["прекратить спорить","stop arguing"],
  ["слово имеет корни в русском языке","word has roots in Russian"],
  ["иметь глубокие исторические корни","have deep historical roots"],
  ["семейные корни","family roots"],
  ["среди прочих","among others"],
  ["делать другим","do to others"],
  ["уважать других","respect others"],
  ["глину обжигают","clay is fired"],
  ["предмет гончарного изделия","piece of pottery"],
  ["древняя керамика","ancient pottery"],
  ["керамика ручной работы","handmade pottery"],
  ["занятие по гончарному делу","pottery class"],
  ["развивать навыки","develop skills"],
  ["развивать идеи","develop ideas"],
  ["разрабатывать программное обеспечение","develop software"],
  ["быстро развиваться","rapidly develop"],
  ["заказать еду","order food"],
  ["заказать такси","order a taxi"],
  ["заказать товары онлайн","order goods online"],
  ["разместить заказ","place an order"],
  ["бесплатная доставка","free delivery"],
  ["экспресс-доставка","express delivery"],
  ["доставка пиццы","pizza delivery"],
  ["пластиковый контейнер","plastic container"],
  ["стеклянный контейнер","glass container"],
  ["контейнер для хранения","storage container"],
  ["грузовой контейнер","shipping container"],
  ["да, действительно","yes, indeed"],
  ["очень интересно, действительно","very interesting indeed"],
  ["хорошо, действительно","good indeed"],
  ["пойти в аптеку","go to the pharmacy"],
  ["купить лекарство в аптеке","buy medicine at the pharmacy"],
  ["мы очень ценим вашу помощь","we value your help a lot"],
  ["мы ценим ваше мнение","we value your opinion"],
  ["высоко ценить","highly value"],
  ["чистый снег","pure snow"],
  ["чистая вода","pure water"],
  ["символизировать мир","symbolize peace"],
  ["символизировать любовь","symbolize love"],
  ["символизировать свободу","symbolize freedom"],
  ["мысленный образ","mental image"],
  ["размытое изображение","blurry image"],
  ["яркий образ","vivid image"]
];

let current = 0;
const cardEl = document.getElementById('card');
const frontText = document.getElementById('frontText');
const backText = document.getElementById('backText');
const counter = document.getElementById('counter');
const progress = document.getElementById('progress');

function render() {
  cardEl.classList.remove('is-flipped');
  frontText.textContent = cards[current][0];
  backText.textContent = cards[current][1];
  counter.textContent = `${current + 1} / ${cards.length}`;
  progress.style.width = `${((current + 1) / cards.length) * 100}%`;
}

function flipCard() { cardEl.classList.toggle('is-flipped'); }

function goNext() {
  current = (current + 1) % cards.length;
  render();
}

function goBack() {
  current = (current - 1 + cards.length) % cards.length;
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') goNext();
  else if (e.key === 'ArrowLeft') goBack();
  else if (e.key === ' ') { e.preventDefault(); flipCard(); }
});

render();
</script>

</html>
